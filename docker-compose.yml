services:
  mysql:
    image: mysql
    container_name: ecommerce-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3306:3306"
    networks:
      - ecommerce-network
    volumes:
      - mysql_data:/var/lib/mysql

  minio:
    image: quay.io/minio/minio
    container_name: ecommerce-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9090"
    ports:
      - "9000:9000"
      - "9090:9090"
    volumes:
      - minio_data:/data
    networks:
      - ecommerce-network

  app:
    image: ecommerce:latest
    depends_on:
      - mysql
      - minio
    ports:
      - "8080:8080"
    networks:
      - ecommerce-network
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://ecommerce-mysql:3306/ecommerce
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: product-image

  liquibase:
    image: liquibase/liquibase
    container_name: liquibase
    environment:
      DB_URL: jdbc:mysql://ecommerce-mysql:3306/ecommerce
      DB_USERNAME: admin
      DB_PASSWORD: admin
      LIQUIBASE_CHANGELOG: classpath:db/changelog/changelog-master.xml
    volumes:
      - ./liquibase/changelog:/liquibase/changelog
    depends_on:
      - mysql
    command: --url=${DB_URL} --username=${DB_USERNAME} --password=${DB_PASSWORD} --changeLogFile=${LIQUIBASE_CHANGELOG} update

volumes:
  mysql_data:
  minio_data:
networks:
  ecommerce-network:
    driver: bridge